apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-service
  labels:
    app: movie-service
    environment: {{ .Values.environment }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: movie-service
  template:
    metadata:
      labels:
        app: movie-service
        environment: {{ .Values.environment }}
    spec:
      containers:
      - name: movie-service
        image: "{{ .Values.movieService.image }}:{{ .Values.movieService.tag }}"
        ports:
        - containerPort: {{ .Values.movieService.containerPort }}
        env:
        {{- range .Values.movieService.env }}
        - name: {{ .name }}
          value: "{{ .value }}"
        {{- end }}
